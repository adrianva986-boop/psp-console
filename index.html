<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050608">
<title>PSP Street E1000 - Web Edition</title>
<style>
:root{--bg:#050608;--ink:#cfd5e2}
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);display:grid;place-items:center;overflow:hidden;font-family:system-ui,sans-serif;color:var(--ink)}

.psp{container-type:size;position:relative;width:min(100vw,205vh);height:100vh;height:100dvh;border-radius:2.5cqw/5cqh;background:linear-gradient(#2a2d35,#12141a 10%,#07080a 60%,#010102);box-shadow:inset 0 .3cqw .2cqw rgba(255,255,255,.25),inset 0 -.8cqw 1.5cqw #000,0 0 0 .2cqw #1a1c22}
.psp>*{position:absolute}
.bez{left:50%;top:50%;transform:translate(-50%,-50%);width:64cqw;padding:.8cqw;border-radius:1.2cqw;background:linear-gradient(#b0b5bd,#656a75 40%,#2c3038);box-shadow:0 .3cqw .6cqw #000,inset 0 .2cqw .1cqw rgba(255,255,255,.5)}
.glass{position:relative;width:100%;aspect-ratio:16/9;border-radius:.4cqw;overflow:hidden;background:#000;box-shadow:inset 0 0 1.4cqw #000}
.glass::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;background:linear-gradient(160deg,rgba(255,255,255,.08),transparent 35%)}

/* Emulator Screen & File Loader UI */
#emulator-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; z-index: 5; }
#rom-loader { position: absolute; inset: 0; z-index: 10; background: linear-gradient(135deg, #0b192c, #1e3e62); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; padding: 2cqw; text-align: center; }
#rom-loader h1 { font-size: 2.5cqw; margin-bottom: 0.5cqw; color: #f5cc00; text-shadow: 0 0 1cqw rgba(245,204,0,0.5); }
#rom-loader p { font-size: 1.3cqw; opacity: 0.8; margin-bottom: 2cqw; }
.rom-btn { background: #e2504f; color: #fff; border: 0; padding: 1cqw 2.5cqw; font-size: 1.4cqw; font-weight: 700; border-radius: 0.8cqw; cursor: pointer; box-shadow: 0 0.5cqw 1cqw rgba(0,0,0,0.4); }
.rom-btn:active { transform: scale(0.95); filter: brightness(1.2); }

.dp{left:3cqw;top:50%;transform:translateY(-62%);width:12cqw;height:12cqw;display:grid;grid:1fr 1fr 1fr/1fr 1fr 1fr}
.dp button{border:0;color:#aab1c0;font-size:1.3cqw;background:linear-gradient(#4b505c,#1d2027);box-shadow:inset 0 .2cqw .1cqw rgba(255,255,255,.35),0 .4cqw .7cqw #000;padding:0}
.dp .u{grid-area:1/2;border-radius:1cqw 1cqw 0 0}.dp .d{grid-area:3/2;border-radius:0 0 1cqw 1cqw}
.dp .l{grid-area:2/1;border-radius:1cqw 0 0 1cqw}.dp .r{grid-area:2/3;border-radius:0 1cqw 1cqw 0}
.dp i{grid-area:2/2;background:#23262e}
.nub{left:10.5cqw;bottom:7cqh;width:5.4cqw;height:5.4cqw;border-radius:50%;background:radial-gradient(circle at 40% 30%,#6d7280,#1b1d23 70%);box-shadow:inset 0 .2cqw .2cqw rgba(255,255,255,.4),0 .5cqw .8cqw #000,0 0 0 .5cqw #0d0e12}
.face{right:3cqw;top:50%;transform:translateY(-62%);width:14cqw;height:14cqw}
.fb{position:absolute;width:4.8cqw;height:4.8cqw;border-radius:50%;border:0;padding:0;font-size:2.2cqw;color:#fff;background:radial-gradient(circle at 35% 28%,#8d93a1,#2a2d35 65%,#0e0f12);box-shadow:inset 0 .2cqw .2cqw rgba(255,255,255,.4),0 .5cqw .8cqw #000}
.t{top:0;left:4.6cqw;color:#3fd08a}.o{top:4.6cqw;right:0;color:#e2504f}.x{bottom:0;left:4.6cqw;color:#7db4ff}.q{top:4.6cqw;left:0;color:#e07ab8}
.on{filter:brightness(1.6);transform:scale(.93)}
.ss{left:50%;transform:translateX(-50%);bottom:4cqh;display:flex;gap:2cqw}
.ss button{border:0;width:5cqw;height:1.5cqw;border-radius:1cqw;font-size:.8cqw;color:#8b92a1;background:linear-gradient(#444955,#1a1c22);box-shadow:0 .3cqw .5cqw #000;padding:0}
.logo{left:7cqw;bottom:5cqh;font:italic 800 2.4cqw system-ui;letter-spacing:.1cqw;color:#8b92a1}
.sh{top:1.5cqh;width:14cqw;height:3.6cqw;border-radius:0 0 1.6cqw 1.6cqw;background:linear-gradient(#3a3f4c,#181a20);font-size:1.1cqw;color:#8b92a1;box-shadow:0 .2cqw .4cqw rgba(0,0,0,.5)}

.rot{display:none;position:fixed;inset:0;place-items:center;font-size:6vw;background:var(--bg);z-index:100;color:#fff}
@media(orientation:portrait){.psp{display:none}.rot{display:grid}}
</style>
</head>
<body>

<div class="psp">
 <div class="sh" style="left:3cqw">L</div><div class="sh" style="right:3cqw">R</div>
 <div class="dp"><button class="u">▲</button><button class="l">◀</button><i></i><button class="r">▶</button><button class="d">▼</button></div>
 <div class="nub"></div><div class="logo">PSP Street</div>
 <div class="bez"><div class="glass">
  
  <!-- ROM Selector & Launcher Screen -->
  <div id="rom-loader">
    <h1>PSP STREET E1000</h1>
    <p>Select a PSP Game ROM (.iso or .cso) to boot the emulator core</p>
    <input type="file" id="rom-file-input" accept=".iso,.cso,.zip" style="display:none">
    <button class="rom-btn" onclick="document.getElementById('rom-file-input').click()">Load PSP Game (.iso)</button>
  </div>

  <!-- Embedded Web Assembly Emulator Frame -->
  <iframe id="emulator-frame" src="https://root-hunter.github.io/ppsspp-web/" hidden></iframe>

 </div></div>
 <div class="face">
  <button class="fb t">△</button><button class="fb o">○</button>
  <button class="fb x">✕</button><button class="fb q">□</button>
 </div>
 <div class="ss"><button>SELECT</button><button>START</button></div>
</div>
<div class="rot">Turn your phone sideways</div>

<script>
document.getElementById('rom-file-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if(file) {
    document.getElementById('rom-loader').style.display = 'none';
    document.getElementById('emulator-frame').removeAttribute('hidden');
    console.log("Loading PSP Game ROM:", file.name);
  }
});
</script>

</body>
</html>
