<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050608">
<link rel="manifest" href="manifest.json">
<title>PSP Console</title>
<style>
:root{--bg:#050608;--ink:#cfd5e2}
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);display:grid;place-items:center;overflow:hidden;font-family:system-ui,sans-serif;color:var(--ink)}

/* Boot Screen */
#boot{position:fixed;inset:0;background:#000;z-index:100;display:grid;place-items:center;color:#fff;transition:opacity .8s ease}
#boot-inner{text-align:center}
#boot h1{font-size:3.5cqw;letter-spacing:.3cqw;margin:0;font-weight:300;opacity:0;animation:fadeInOut 2.5s forwards}
@keyframes fadeInOut{0%{opacity:0;transform:scale(.95)}50%{opacity:1;transform:scale(1)}100%{opacity:0}}

.psp{container-type:size;position:relative;width:min(100vw,205vh);height:100vh;height:100dvh;border-radius:2.5cqw/5cqh;background:linear-gradient(#3a3f4b,#14161c 10%,#0a0b0e 60%,#020203);box-shadow:inset 0 .3cqw .2cqw rgba(255,255,255,.35),inset 0 -.8cqw 1.5cqw #000,0 0 0 .2cqw #2b2f39}
.psp>*{position:absolute}
.bez{left:50%;top:50%;transform:translate(-50%,-50%);width:62cqw;padding:.7cqw;border-radius:1.2cqw;background:linear-gradient(#cfd4de,#7c828f 40%,#3d424d);box-shadow:0 .3cqw .6cqw #000,inset 0 .2cqw .1cqw rgba(255,255,255,.6)}
.glass{position:relative;width:100%;aspect-ratio:16/9;border-radius:.5cqw;overflow:hidden;background:#000;box-shadow:inset 0 0 1.4cqw #000}
.glass::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;background:linear-gradient(160deg,rgba(255,255,255,.12),transparent 35%)}
#cv{width:100%;height:100%;display:block}
#hud{position:absolute;left:1.2cqw;top:.8cqw;z-index:3;font-size:1.5cqw;font-weight:700;color:#fff;text-shadow:0 0 .6cqw #000;white-space:pre}

#menu{position:absolute;inset:0;z-index:5;color:#fff;overflow:hidden;background:linear-gradient(120deg,#0b3d91,#1b7fd6,#0b2f6e,#2a9df4);background-size:300% 300%;animation:w 14s ease infinite}
@keyframes w{50%{background-position:100% 50%}}
#menu::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(ellipse at 50% 130%,rgba(255,255,255,.1) 0 2cqw,transparent 2cqw 4.5cqw)}
#menu .top{position:absolute;left:1.4cqw;top:1cqw;font-size:1.4cqw;opacity:.85}
#row{position:absolute;left:0;top:7.5cqw;display:flex;gap:2cqw;transition:transform .25s}
.tile{width:11cqw;height:11cqw;border-radius:1.6cqw;display:grid;place-items:center;font-size:5.6cqw;background:rgba(255,255,255,.16);box-shadow:inset 0 .2cqw .2cqw rgba(255,255,255,.5),0 .5cqw 1cqw rgba(0,0,0,.35);transition:transform .25s,background .25s}
.tile.s{transform:scale(1.25);background:linear-gradient(#fff6,#fff2)}
#ttl{position:absolute;bottom:5cqw;width:100%;text-align:center;font-size:2.4cqw;font-weight:600}
#menu .hint{position:absolute;bottom:1cqw;width:100%;text-align:center;font-size:1.1cqw;opacity:.75}

/* Interactive L/R Shoulder Bumpers slid slightly down */
.sh{top:1.5cqh;width:14cqw;height:3.6cqh;border-radius:0 0 1.6cqw 1.6cqw;background:linear-gradient(#4a4f5c,#1c1e25);display:grid;place-items:center;font-size:1.1cqw;color:#8b92a1;cursor:pointer;z-index:10;box-shadow:0 .2cqw .4cqw rgba(0,0,0,.5)}
.sh.on{filter:brightness(1.5);transform:scale(.97)}

.dp{left:3cqw;top:50%;transform:translateY(-62%);width:12cqw;height:12cqw;display:grid;grid:1fr 1fr 1fr/1fr 1fr 1fr}
.dp button{border:0;color:#aab1c0;font-size:1.3cqw;background:linear-gradient(#4b505c,#1d2027);box-shadow:inset 0 .2cqw .1cqw rgba(255,255,255,.35),0 .4cqw .7cqw #000;padding:0}
.dp .u{grid-area:1/2;border-radius:1cqw 1cqw 0 0}.dp .d{grid-area:3/2;border-radius:0 0 1cqw 1cqw}
.dp .l{grid-area:2/1;border-radius:1cqw 0 0 1cqw}.dp .r{grid-area:2/3;border-radius:0 1cqw 1cqw 0}
.dp i{grid-area:2/2;background:#23262e}
.nub{left:10.5cqw;bottom:7cqh;width:5.4cqw;height:5.4cqw;border-radius:50%;background:radial-gradient(circle at 40% 30%,#6d7280,#1b1d23 70%);box-shadow:inset 0 .2cqw .2cqw rgba(255,255,255,.4),0 .5cqw .8cqw #000,0 0 0 .5cqw #0d0e12}
.face{right:3cqw;top:50%;transform:translateY(-62%);width:14cqw;height:14cqw}
.fb{position:absolute;width:4.8cqw;height:4.8cqw;border-radius:50%;border:0;padding:0;font-size:2.2cqw;color:#fff;background:radial-gradient(circle at 35% 28%,#8d93a1,#2a2d35 65%,#0e0f12);box-shadow:inset 0 .2cqw .2cqw rgba(255,255,255,.4),0 .5cqw .8cqw #000}
.t{top:0;left:4.6cqw;color:#3fd08a}.o{top:4.6cqw;right:0;color:#e2504f}.x{bottom:0;left:4.6cqw;color:#7db4ff}.q{top:4.6cqw;left:0;color:#e07ab8}
.on{filter:brightness(1.6);transform:scale(.93)}
.ss{left:50%;transform:translateX(-50%);bottom:4cqh;display:flex;gap:2cqw}
.ss button{border:0;width:5cqw;height:1.5cqw;border-radius:1cqw;font-size:.8cqw;color:#8b92a1;background:linear-gradient(#444955,#1a1c22);box-shadow:0 .3cqw .5cqw #000;padding:0}
.logo{left:7cqw;bottom:5cqh;font:italic 800 2.6cqw system-ui;letter-spacing:.1cqw;color:#b9c0cf}
svg.i{display:block}.tile svg{width:6cqw;height:6cqw}.fb svg{width:2.6cqw;height:2.6cqw}.dp button svg{width:1.8cqw;height:1.8cqw}
.fsb{left:50%;transform:translateX(-50%);top:1.2cqh;width:3.4cqw;height:2.2cqw;border:0;border-radius:.5cqw;padding:.35cqw;color:#9aa2b3;background:#23262e}.fsb svg{width:100%;height:100%}
#xh{position:absolute;left:50%;top:50%;width:3cqw;height:3cqw;margin:-1.5cqw;z-index:3;display:none;pointer-events:none;color:#fff;filter:drop-shadow(0 0 2px #000)}#xh svg{width:100%;height:100%}

/* Settings / App Store UI Panels */
#set{position:absolute;inset:0;z-index:6;display:none;padding:2cqw 5cqw;font-size:1.7cqw;color:#fff;background:linear-gradient(#0b2f6e,#06142e);overflow-y:auto}
#set b{display:block;font-size:2.4cqw;margin-bottom:.8cqw}
#set div{display:flex;justify-content:space-between;padding:.6cqw 1.2cqw;margin:.2cqw 0;border-radius:.8cqw}
#set .a{background:rgba(255,255,255,.22)}
#set small{display:block;margin-top:1cqw;text-align:center;font-size:1.1cqw;opacity:.7}

/* Store Modal */
#store{position:absolute;inset:0;z-index:6;display:none;padding:2cqw 4cqw;background:linear-gradient(#141c2e,#0a0e17);color:#fff;overflow-y:auto}
#store b{font-size:2.4cqw;display:block;margin-bottom:1cqw}
.store-item{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.1);padding:.8cqw 1.4cqw;margin:.5cqw 0;border-radius:.8cqw}
.store-item.a{background:rgba(255,255,255,.25)}
.store-btn{background:#3fd08a;color:#000;border:0;padding:.4cqw 1cqw;border-radius:.5cqw;font-weight:700;cursor:pointer}
.store-btn.del{background:#e2504f;color:#fff}

.rot{display:none;position:fixed;inset:0;place-items:center;font-size:6vw;background:var(--bg);z-index:100;color:#fff}
@media(orientation:portrait){.psp{display:none}.rot{display:grid}}
</style></head><body>

<!-- Boot Screen -->
<div id="boot"><div id="boot-inner"><h1>Sony Computer Entertainment</h1></div></div>

<div class="psp">
<div class="sh" id="btn-l" style="left:3cqw">L</div><div class="sh" id="btn-r" style="right:3cqw">R</div>
<div class="dp"><button class="u" data-k="u">▲</button><button class="l" data-k="l">◀</button><i></i><button class="r" data-k="r">▶</button><button class="d" data-k="d">▼</button></div>
<div class="nub"></div><button class="fsb" id="fs"></button><div class="logo">PSP</div>
<div class="bez"><div class="glass"><canvas id="cv"></canvas><div id="hud"></div><div id="set"></div><div id="store"></div><div id="xh"></div>
<div id="menu"><div class="top" id="user-display">User: Player</div><div id="row"></div><div id="ttl"></div><div class="hint">Left / Right: choose   Cross: play   Circle: menu</div></div></div></div>
<div class="face"><button class="fb t" data-k="t">△</button><button class="fb o" data-k="o">○</button><button class="fb x" data-k="x">✕</button><button class="fb q" data-k="q">□</button></div>
<div class="ss"><button data-k="sel">SELECT</button><button data-k="st">START</button></div>
</div>
<div class="rot">Turn your phone sideways</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Hide boot screen after animation */
setTimeout(()=>{const b=$('#boot');b.style.opacity=0;setTimeout(()=>b.remove(),800)},2200);

const T=THREE,$=s=>document.querySelector(s),K={};let P={};
const press=(k,v)=>{if(v&&!K[k]){P[k]=1;sfx('click')}K[k]=v};
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
b.onpointerdown=e=>{e.preventDefault();b.classList.add('on');press(k,1)};
b.onpointerup=b.onpointercancel=b.onpointerleave=()=>{b.classList.remove('on');press(k,0)}});

/* Shoulder bumpers interactive touch binding */
['l','r'].forEach(side=>{
  const el=$('#btn-'+side);
  el.onpointerdown=e=>{e.preventDefault();el.classList.add('on');press(side=='l'?'q':'t',1)};
  el.onpointerup=el.onpointercancel=el.onpointerleave=()=>{el.classList.remove('on');press(side=='l'?'q':'t',0)};
});

const KM={ArrowUp:'u',w:'u',ArrowDown:'d',s:'d',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',' ':'x',z:'x',Enter:'x',x:'o',Escape:'o',Shift:'sel',c:'t',v:'q'};
onkeydown=e=>{const k=KM[e.key];if(k){e.preventDefault();press(k,1)}};
onkeyup=e=>{const k=KM[e.key];if(k)press(k,0)};

/* Persistent User Data & Settings */
const STORE_KEY='psp_user_data_v1';
let UserData = JSON.parse(localStorage.getItem(STORE_KEY)) || {
  name: 'Adrian',
  sound: true,
  vol: 0.6,
  view: 'TPP',
  q: 2,
  vibrate: true,
  theme: 'Blue',
  installed: ['Neon Racer','Star Strike','Orb Rush','Brick Smash','Snake 3D','Metro City','Combat Zone']
};
const saveUserData=()=>localStorage.setItem(STORE_KEY, JSON.stringify(UserData));
$('#user-display').textContent='User: '+UserData.name;

/* helpers */
const tex=(w,f,r)=>{const c=document.createElement('canvas');c.width=c.height=w;f(c.getContext('2d'),w);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=4;r&&t.repeat.set(r[0],r[1]);return t};
const nz=c=>tex(64,(x,w)=>{x.fillStyle=c;x.fillRect(0,0,w,w);for(let i=0;i<350;i++){x.fillStyle=`rgba(${Math.random()<.5?'255,255,255':'0,0,0'},${Math.random()*.16})`;x.fillRect(Math.random()*w,Math.random()*w,2+Math.random()*3,2+Math.random()*3)}x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=3;x.strokeRect(1,1,w-2,w-2)});
const grid=(a,b,l)=>tex(128,(x,w)=>{x.fillStyle=a;x.fillRect(0,0,w,w);x.strokeStyle=b;x.lineWidth=5;x.strokeRect(0,0,w,w);if(l){x.fillStyle=l;x.fillRect(w/2-3,0,6,w)}});
const M=(map,o)=>new T.MeshStandardMaterial(Object.assign({map,roughness:.5,metalness:.2},o));
const cam=f=>new T.PerspectiveCamera(f||60,16/9,.1,250);
const base=(bg,fg)=>{const s=new T.Scene();s.background=new T.Color(bg);s.fog=new T.Fog(bg,fg[0],fg[1]);s.add(new T.HemisphereLight(0xffffff,0x334455,.95));const d=new T.DirectionalLight(0xffffff,.9);d.position.set(5,10,7);s.add(d);return s};
const rnd=(a,b)=>a+Math.random()*(b-a);
const BOX=(w,h,d)=>new T.BoxGeometry(w,h,d),SPH=(r,n)=>new T.SphereGeometry(r,n||24,n||24);

/* Game Generators */
function racer(){const s=base(0x0a0620,[25,100]),c=cam(),g={s,c,o:0,sc:0,q:1};c.position.set(0,4.2,8);c.lookAt(0,0,-12);
const rt=grid('#15122e','#ff3cac','#fff');rt.repeat.set(3,50);
const rd=new T.Mesh(new T.PlaneGeometry(12,200),M(rt,{emissive:0x180828}));rd.rotation.x=-Math.PI/2;rd.position.z=-80;s.add(rd);
const hz=tex(64,(x,w)=>{x.fillStyle='#ff9d00';x.fillRect(0,0,w,w);x.fillStyle='#111';for(let i=0;i<2*w;i+=16){x.beginPath();x.moveTo(i,0);x.lineTo(i+8,0);x.lineTo(i+8-w,w);x.lineTo(i-w,w);x.fill()}});
const car=new T.Group(),bm=M(null,{color:0xff2a55,metalness:.8,roughness:.25});
const b1=new T.Mesh(BOX(2,.7,3.6),bm);b1.position.y=.6;const b2=new T.Mesh(BOX(1.6,.6,1.6),M(null,{color:0x111827,metalness:.9,roughness:.1}));b2.position.set(0,1.2,.2);car.add(b1,b2);
for(const[x,z]of[[1,1.2],[-1,1.2],[1,-1.2],[-1,-1.2]]){const w=new T.Mesh(new T.CylinderGeometry(.45,.45,.4,16),M(null,{color:0x111}));w.rotation.z=Math.PI/2;w.position.set(x*1.05,.45,z);car.add(w)}
car.position.z=3;s.add(car);
const ob=[],pl=[];let lane=0,tm=1,t=0;
for(let i=0;i<14;i++)for(const q of[-1,1]){const p=new T.Mesh(BOX(.6,3,.6),new T.MeshBasicMaterial({color:q<0?0x00e5ff:0xff3cac}));p.position.set(q*7.5,1.5,-i*8);s.add(p);pl.push(p)}
g.u=dt=>{if(g.o)return;t+=dt;const sp=22+t*.7;
if(P.l&&lane>-1)lane--;if(P.r&&lane<1)lane++;
car.position.x+=(lane*4-car.position.x)*Math.min(1,dt*10);car.rotation.y=(car.position.x-lane*4)*.08;
rt.offset.y+=dt*sp/4;pl.forEach(p=>{p.position.z+=sp*dt;if(p.position.z>10)p.position.z-=112});
if((tm-=dt)<0){tm=Math.max(.35,1.1-t*.01);const o=new T.Mesh(BOX(2.6,2,2.6),M(hz));o.position.set(((Math.random()*3)|0)*4-4,1,-90);s.add(o);ob.push(o)}
for(let i=ob.length;i--;){const o=ob[i];o.position.z+=sp*dt;if(o.position.z>10){s.remove(o);ob.splice(i,1)}else if(Math.abs(o.position.z-3)<2.8&&Math.abs(o.position.x-car.position.x)<2.2)g.o=1}
g.sc=(t*10)|0};
g.h=()=>'SCORE '+g.sc;return g}

function space(){const s=base(0x02030a,[50,140]),c=cam(70),g={s,c,o:0,sc:0};c.position.set(0,0,9);
const a=new Float32Array(1800);for(let i=0;i<1800;i+=3){a[i]=rnd(-60,60);a[i+1]=rnd(-35,35);a[i+2]=-Math.random()*150}
const sg=new T.BufferGeometry();sg.setAttribute('position',new T.BufferAttribute(a,3));
const st=new T.Points(sg,new T.PointsMaterial({size:.4,color:0xbfd8ff,fog:false})),st2=st.clone();s.add(st,st2);
const sh=new T.Group(),cone=new T.Mesh(new T.ConeGeometry(.6,2.4,16),M(nz('#c9d3e6'),{metalness:.8,roughness:.25}));cone.rotation.x=-Math.PI/2;
const wg=new T.Mesh(BOX(3,.12,.9),M(nz('#4f7cff'),{metalness:.6}));wg.position.z=.5;
const gl=new T.Mesh(SPH(.3,12),new T.MeshBasicMaterial({color:0x66f0ff}));gl.position.z=1.3;sh.add(cone,wg,gl);s.add(sh);
const rk=M(nz('#7a6656'),{flatShading:true,roughness:.9}),eg=new T.IcosahedronGeometry(1.1,1),bg=new T.CylinderGeometry(.1,.1,1.4,8),bm=new T.MeshBasicMaterial({color:0xffe45e});
bg.rotateX(Math.PI/2);
const bl=[],en=[],rm=(a,i)=>{s.remove(a[i]);a.splice(i,1)};let cd=0,tm=1,t=0;
g.u=dt=>{if(g.o)return;t+=dt;const f=(t*40)%150;st.position.z=f;st2.position.z=f-150;
const ax=(K.r?1:0)-(K.l?1:0),ay=(K.u?1:0)-(K.d?1:0);
sh.position.x=Math.max(-7,Math.min(7,sh.position.x+ax*14*dt));sh.position.y=Math.max(-3.8,Math.min(3.8,sh.position.y+ay*14*dt));
sh.rotation.z+=(-ax*.6-sh.rotation.z)*Math.min(1,dt*8);
if((cd-=dt)<=0&&K.x){cd=.16;sfx('shoot');const b=new T.Mesh(bg,bm);b.position.copy(sh.position);b.position.z-=1.6;s.add(b);bl.push(b)}
for(let i=bl.length;i--;){bl[i].position.z-=70*dt;if(bl[i].position.z<-110)rm(bl,i)}
if((tm-=dt)<0){tm=Math.max(.3,1-t*.012);const e=new T.Mesh(eg,rk);e.position.set(rnd(-7,7),rnd(-3.5,3.5),-110);s.add(e);en.push(e)}
for(let i=en.length;i--;){const e=en[i];e.position.z+=(28+t*.4)*dt;e.rotation.x+=dt;e.rotation.y+=dt*.7;
if(e.position.z>12)rm(en,i);else if(e.position.distanceTo(sh.position)<1.8)g.o=1;
else for(let j=bl.length;j--;)if(bl[j].position.distanceTo(e.position)<1.7){rm(bl,j);rm(en,i);g.sc+=10;break}}};
g.h=()=>'SCORE '+g.sc;return g}

function orbs(){const s=base(0x101a2b,[30,70]),c=cam(55),g={s,c,o:0,sc:0};c.position.set(0,15,11);c.lookAt(0,0,0);
const fl=tex(128,(x,w)=>{x.fillStyle='#1c2d4a';x.fillRect(0,0,w,w);x.fillStyle='#27406a';x.fillRect(0,0,w/2,w/2);x.fillRect(w/2,w/2,w/2,w/2)},[8,8]);
const f=new T.Mesh(new T.PlaneGeometry(24,24),M(fl,{roughness:.8}));f.rotation.x=-Math.PI/2;s.add(f);
const pl=new T.Mesh(SPH(.8),M(nz('#3aa0ff'),{metalness:.6,roughness:.2}));pl.position.y=.8;s.add(pl);
const orb=new T.Mesh(SPH(.45),new T.MeshStandardMaterial({color:0xffc933,emissive:0x664400,metalness:.9,roughness:.2}));s.add(orb);
const place=m=>m.position.set(rnd(-10,10),.9,rnd(-10,10));place(orb);
const cm=M(nz('#e0334a'),{flatShading:true}),cg=new T.IcosahedronGeometry(.85,1),ch=[];let vx=0,vz=0,t=0;
g.u=dt=>{if(g.o)return;t+=dt;
vx+=((K.r?1:0)-(K.l?1:0))*45*dt;vz+=((K.d?1:0)-(K.u?1:0))*45*dt;const dm=1-Math.min(1,4*dt);vx*=dm;vz*=dm;
pl.position.x=Math.max(-11,Math.min(11,pl.position.x+vx*dt));pl.position.z=Math.max(-11,Math.min(11,pl.position.z+vz*dt));
pl.rotation.z-=vx*dt/.8;pl.rotation.x+=vz*dt/.8;
orb.position.y=.9+Math.sin(t*4)*.2;orb.rotation.y+=dt*2;
if(orb.position.distanceTo(pl.position)<1.5){g.sc++;place(orb);if(g.sc%3==0){const e=new T.Mesh(cg,cm);e.position.set(rnd(-1,1)>0?11:-11,.85,rnd(-11,-8));s.add(e);ch.push(e)}}
for(const e of ch){const d=pl.position.clone().sub(e.position);d.y=0;const l=d.length();d.multiplyScalar(Math.min(5.5,3+g.sc*.1)*dt/l);e.position.add(d);e.rotation.x+=dt*3;e.rotation.z+=dt*2;if(l<1.6)g.o=1}};
g.h=()=>'ORBS '+g.sc;return g}

function bricks(){const s=base(0x120a24,[40,90]),c=cam(50),g={s,c,o:0,sc:0};c.position.set(0,-5,17);c.lookAt(0,0,0);
const wl=new T.Mesh(new T.PlaneGeometry(19,17),M(grid('#1a1033','#3b2a6b'),{roughness:.9}));wl.material.map.repeat.set(9,8);wl.position.z=-1;s.add(wl);
const rail=new T.MeshBasicMaterial({color:0x00e5ff});for(const q of[-1,1]){const r=new T.Mesh(BOX(.3,17,1),rail);r.position.set(q*9.1,0,0);s.add(r)}
const pd=new T.Mesh(BOX(3.4,.6,.9),M(nz('#c9d3e6'),{metalness:.8,roughness:.2}));pd.position.y=-6.3;s.add(pd);

$('#fs').innerHTML=svg(IC.fs);$('#fs').onclick=toggleFS;$('#xh').innerHTML=svg('<path d="M12 3v6M12 15v6M3 12h6M15 12h6"/>');

/* Expanded Settings UI */
const setEl=$('#set'),SR=[
  ['User Profile',()=>UserData.name],
  ['Sound',()=>UserData.sound?'On':'Off'],
  ['Volume',()=>Math.round(UserData.vol*100)+'%'],
  ['Camera',()=>UserData.view=='TPP'?'Third Person':'First Person'],
  ['Graphics',()=>UserData.q>1?'High':'Low'],
  ['Vibration',()=>UserData.vibrate?'On':'Off'],
  ['Theme',()=>UserData.theme],
  ['Full Screen',()=>document.fullscreenElement?'On':'Off']
];
const drawS=()=>{
  setEl.innerHTML='<b>Settings & Profile</b>'+SR.map((r,i)=>`<div class="${i==ri?'a':''}"><span>${r[0]}</span><span>${r[1]()}</span></div>`).join('')+'<small>Up/Down: select   Left/Right: change   Circle: back</small>';
};
const chgS=d=>{
  if(ri==0){const n=prompt('Enter profile name:',UserData.name);if(n){UserData.name=n;$('#user-display').textContent='User: '+n;saveUserData()}}
  if(ri==1)UserData.sound=!UserData.sound;
  if(ri==2)UserData.vol=Math.max(0,Math.min(1,UserData.vol+d*.1));
  if(ri==3)UserData.view=UserData.view=='TPP'?'FPP':'TPP';
  if(ri==4){UserData.q=UserData.q>1?1:2;R.setPixelRatio(UserData.q>1?Math.min(devicePixelRatio,2):1);fit()}
  if(ri==5)UserData.vibrate=!UserData.vibrate;
  if(ri==6)UserData.theme=UserData.theme=='Blue'?'Dark':'Blue';
  if(ri==7)toggleFS();
  saveUserData();
};

/* App Store / Download Games UI */
const storeEl=$('#store');
const drawStore=()=>{
  const avail=Object.keys(ALL_GAMES);
  storeEl.innerHTML='<b>App Store (Download Games)</b>'+avail.map((g,i)=>{
    const inst=UserData.installed.includes(g);
    return `<div class="store-item ${i==stRi?'a':''}"><span>${g}</span><button class="store-btn ${inst?'del':''}">${inst?'Uninstall':'Install'}</button></div>`;
  }).join('')+'<small style="text-align:center;display:block;margin-top:1cqw;opacity:.7">Up/Down: select   Cross: install/uninstall   Circle: back</small>';
};
const toggleStoreGame=()=>{
  const avail=Object.keys(ALL_GAMES),g=avail[stRi];
  if(UserData.installed.includes(g)){
    if(UserData.installed.length>1)UserData.installed=UserData.installed.filter(x=>x!==g);
    else alert('You must keep at least 1 game installed!');
  } else {
    UserData.installed.push(g);
  }
  saveUserData();rebuildGames();show();drawStore();
};

const start=i=>{
  const title=GAMES[i][0];
  if(title=='Settings'){inS=1;setEl.style.display='block';drawS();return}
  if(title=='App Store'){inStore=1;storeEl.style.display='block';drawStore();return}
  G=GAMES[i][2]();go=0;ls=0;$('#xh').style.display=G.xh?'block':'none';menu.style.display='none';fit()
};

show();let last=0;
(function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1e3,.05);last=t;
if(G){if(P.o||P.sel){G=null;menu.style.display='';hud.textContent='';$('#xh').style.display='none';R.clear()}else if(G.o&&P.x)start(sel);else G.u(dt)}
else if(inS){
  if(P.u&&ri>0)ri--;if(P.d&&ri<SR.length-1)ri++;if(P.l)chgS(-1);if(P.r)chgS(1);if(P.x&&ri==7)toggleFS();
  if(P.o||P.sel){inS=0;setEl.style.display='none'}
  drawS();
}else if(inStore){
  const avail=Object.keys(ALL_GAMES);
  if(P.u&&stRi>0)stRi--;if(P.d&&stRi<avail.length-1)stRi++;
  if(P.x)toggleStoreGame();
  if(P.o||P.sel){inStore=0;storeEl.style.display='none'}
  drawStore();
}else{
  if(P.r&&sel<GAMES.length-1){sel++;show()}
  if(P.l&&sel>0){sel--;show()}
  if(P.x||P.st)start(sel)
}
P={};
if(G){if(G.sc>ls&&!G.q)sfx('coin');ls=G.sc;if(G.o&&!go){go=1;sfx('over')}R.render(G.s,G.c);hud.textContent=G.h()+(G.o?'\nGAME OVER   Cross: retry   Circle: menu':'')}
})(0);
</script></body></html>
